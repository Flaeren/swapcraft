[package]
name = "voidflare-hub"
description = "voidflare hub: lists the voidflare converters and starts them"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
egui.workspace = true
eframe.workspace = true
vf-ui.workspace = true
vf-core.workspace = true
rfd = "0.17"

# The progress card of the right-click menu asks Windows 11 for rounded corners (it has no title bar).
# "Convert here" in Nemo reads the files copied with Ctrl+C (text/uri-list, X11 and Wayland).
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

# Puts the flame icon and the product name into the exe itself (Explorer, pinned shortcuts).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

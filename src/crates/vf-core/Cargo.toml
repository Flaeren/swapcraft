[package]
name = "vf-core"
description = "voidflare shared core: languages, engine discovery, conversion jobs. No GUI code."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lopdf = { version = "0.46.0", default-features = false }
serde_json = "1.0.154"
sys-locale = "0.3.2"
# Update check against the GitHub Releases of the project: plain HTTPS GET, no telemetry.
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
sha2 = "0.11.1"
zip = { version = "9.2.1", default-features = false, features = ["deflate"] }

name: build

# Builds the portable packages from clean Windows and Linux machines: the engines come from their official releases at the
# versions pinned in src/engines.json (hash-checked), CADCraft is built from source with our patch, then the hub
# and the apps are built and packed. Nothing here depends on anything installed by hand.
#
#   push / pull request   build and test; the release files (full bundle, hub, one ZIP per app and per engine,
#                         manifest.json, SHA256SUMS.txt) are kept as a build artifact for 14 days
#   tag v*                the same, then all of those files are published as a GitHub release
#   manual                Actions tab, "Run workflow"
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["src/**", ".github/workflows/build.yml", "CHANGELOG.md"]
  pull_request:
    paths: ["src/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache Cargo downloads and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Engines (pinned, hash-checked) and CADCraft with our patch
        working-directory: src
        run: ./fetch-engines.ps1 -BuildCadcraft

      - name: Tests
        working-directory: src
        env:
          # the tests that need an engine use the ones just fetched
          VOIDFLARE_WORDCRAFT: ${{ github.workspace }}/src/engines/wordcraft/wordcraft-cli.exe
          VOIDFLARE_GRIDCRAFT: ${{ github.workspace }}/src/engines/gridcraft/gridcraft-cli.exe
          VOIDFLARE_DECKCRAFT: ${{ github.workspace }}/src/engines/deckcraft/deckcraft-cli.exe
          VOIDFLARE_PDFCRAFT: ${{ github.workspace }}/src/engines/pdfcraft/pdfcraft-cli.exe
          VOIDFLARE_CADCRAFT: ${{ github.workspace }}/src/engines/cadcraft/cadcraft-cli.exe
        run: cargo test --release --workspace

      - name: Build the hub and the apps
        working-directory: src
        run: ./build-apps.ps1

      # A v* tag must match the version in src/Cargo.toml (release.ps1 then checks every exe carries it).
      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $v = (Select-String -Path src/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME but src/Cargo.toml says $v" }

      - name: Pack the release files
        working-directory: src
        run: ./release.ps1

      # Installs every pack from the files just written and runs its bundled engine, as the hub will.
      - name: Check the release files
        working-directory: src
        run: cargo test --release -p vf-core --test release_assets -- --nocapture

      # Code signing goes here once the project is accepted by the SignPath Foundation (free for open source):
      # the unsigned executables are submitted with signpath/github-action-submit-signing-request and the signed
      # ones replace them before the packing step. Not set up yet.

      - uses: actions/upload-artifact@v4
        with:
          name: voidflare-windows
          path: release/*
          if-no-files-found: error
          retention-days: 14

  # The same for Linux (x86_64): fetch-engines.sh / build-apps.sh / release.sh, the counterparts of the PowerShell
  # scripts. Its files go into the same release, next to the Windows ones.
  package-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies (window system, OpenGL/Vulkan headers)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q pkg-config libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxkbcommon-dev             libwayland-dev libgl1-mesa-dev libgtk-3-dev zip jq

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Cache Cargo downloads and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Engines (pinned, hash-checked) and CADCraft with our patch
        working-directory: src
        run: bash fetch-engines.sh --build-cadcraft

      - name: Tests
        working-directory: src
        run: |
          e="$PWD/engines"
          export VOIDFLARE_WORDCRAFT=$e/wordcraft/wordcraft-cli VOIDFLARE_GRIDCRAFT=$e/gridcraft/gridcraft-cli             VOIDFLARE_DECKCRAFT=$e/deckcraft/deckcraft-cli VOIDFLARE_PDFCRAFT=$e/pdfcraft/pdfcraft-cli             VOIDFLARE_CADCRAFT=$e/cadcraft/cadcraft-cli
          cargo test --release --workspace

      - name: Build the hub and the apps
        working-directory: src
        run: bash build-apps.sh

      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^version = "\(.*\)"//p' src/Cargo.toml | head -1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME but src/Cargo.toml says $v" >&2; exit 1; }

      - name: Pack the release files
        working-directory: src
        run: bash release.sh

      - name: Check the release files
        working-directory: src
        run: cargo test --release -p vf-core --test release_assets -- --nocapture

      - uses: actions/upload-artifact@v4
        with:
          name: swapcraft-linux
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, package-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: voidflare-windows
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: swapcraft-linux
          path: release-linux

      # One release, both systems: the Linux files join the Windows ones and SHA256SUMS.txt is written again over
      # all of them (each job's own list covered only its files). No name is in both sets.
      - name: Put the Windows and Linux files together
        run: |
          rm release-linux/SHA256SUMS.txt
          for f in release-linux/*; do
            [ -e "release/$(basename "$f")" ] && { echo "$(basename "$f") is in both sets" >&2; exit 1; }
          done
          mv release-linux/* release/
          cd release && LC_ALL=C ls -1 | grep -v '^SHA256SUMS.txt$' | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No section for $version in CHANGELOG.md" >&2; exit 1; fi
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every file the hub needs. Names all start with "voidflare-" and the full bundle sorts first, because a
          # 0.1.0 hub takes the first ZIP of a release.
          # A release created by hand for this tag is left alone: replacing its files would change hashes people may
          # already have checked.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, not touching it."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "SwapCraft ${GITHUB_REF_NAME#v}" --notes-file notes.md
